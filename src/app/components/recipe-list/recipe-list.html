<div class="recipe-page">

    <div class="page-header">
      <span class="header-label">Explore</span>
      <h1 class="page-title">Recipe<br><em>Collection</em></h1>
    </div>
  
    <div class="controls-bar">
      <div class="search-wrapper">
        <svg class="search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/>
        </svg>
        <input type="search" [formControl]="searchControl" placeholder="Search recipes…" class="search-input"/>
      </div>
  
      <div class="select-wrapper">
        <select (change)="handleDropdownChange($event)" class="tag-select">
          @for (item of recipeTags(); track $index) {
            <option [value]="item">{{ item }}</option>
          }
        </select>
        <svg class="select-arrow" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
          <polyline points="6 9 12 15 18 9"/>
        </svg>
      </div>
    </div>
  
    <div class="card-wrapper">
      @for(item of recipeStoreData | async; track $index) {
        <div class="recipe-card">
          <div class="card-image-wrap">
            <img [src]="item.image" class="card-img" alt="{{ item.name }}"/>
            <div class="card-img-overlay"></div>
          </div>
          <div class="card-body">
            <h5 class="card-title">{{ item.name }}</h5>
            <div class="card-meta">
              <div class="meta-item">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                  <circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/>
                </svg>
                <span>Prep <strong>{{ item.prepTimeMinutes }}m</strong></span>
              </div>
              <div class="meta-divider"></div>
              <div class="meta-item">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                  <path d="M12 2C6.5 2 2 6.5 2 12s4.5 10 10 10 10-4.5 10-10"/>
                  <path d="M12 6v6l4 2"/>
                </svg>
                <span>Cook <strong>{{ item.cookTimeMinutes }}m</strong></span>
              </div>
            </div>
            <a (click)="goToDetailsPage(item.id)" class="view-btn">
              View Recipe
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
                <line x1="5" y1="12" x2="19" y2="12"/><polyline points="12 5 19 12 12 19"/>
              </svg>
            </a>
          </div>
        </div>
      }
    </div>
  
  </div>
